[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gungnir"
version = "0.1.3"
description = "Shared transport client for the WDGWars (wdgwars.pl) feeders. HMAC envelope, cooldown, silent-drop detection. Used by Muninn (ADS-B), Heimdall (mesh), wigle-to-wdgwars (WiFi/BLE)."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Zach B.", email = "52333936+HiroAlleyCat@users.noreply.github.com"}]
keywords = ["wdgwars", "wardriving", "hmac", "client"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
]

[project.urls]
Homepage = "https://github.com/Yggdrasil-AI-labs/gungnir"
Repository = "https://github.com/Yggdrasil-AI-labs/gungnir"

[tool.setuptools.packages.find]
where = ["."]
include = ["gungnir*"]

[tool.setuptools.package-data]
# PEP 561 - ship the inline type hints to consumers using mypy/pyright.
gungnir = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q"

[tool.coverage.run]
branch = true
source = ["gungnir"]
omit = [
    "tests/*",
]

[tool.coverage.report]
show_missing = true
# Regression floor, set just below the measured baseline (about 78 percent
# line+branch coverage on the gungnir package as of this commit). The build
# fails if coverage drops below this. Raise it as tests are added; it is a
# ratchet, not a target. The real quality enforcement is the SonarCloud
# Clean-as-You-Code gate on new code (see sonar-project.properties).
fail_under = 75
